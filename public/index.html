<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Chat</title>
  <script src="/socket.io/socket.io.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      height: 100%;
      height: 100dvh;
      overflow: hidden;
    }

    body {
      font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
      background: #0f0f0f;
      color: #fff;
      display: flex;
      -webkit-tap-highlight-color: transparent;
    }

    /* ===== SIDEBAR ===== */
    #sidebar {
      width: 280px;
      background: #161616;
      border-right: 1px solid #2a2a2a;
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
      height: 100%;
    }

    .sidebar-header {
      padding: 16px;
      border-bottom: 1px solid #2a2a2a;
      display: flex;
      align-items: center;
      justify-content: space-between;
      min-height: 56px;
    }

    .sidebar-header h2 {
      font-size: 1.15rem;
      font-weight: 600;
    }

    .sala-item {
      padding: 14px 16px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 12px;
      transition: background 0.15s;
      border-left: 3px solid transparent;
      min-height: 56px;
    }

    .sala-item:hover, .sala-item:active { background: #222; }
    .sala-item.ativa {
      background: #1e2a3a;
      border-left-color: #3b82f6;
    }

    .sala-item .icone {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: #2a2a2a;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1rem;
      flex-shrink: 0;
    }

    .sala-item.geral .icone { background: #3b82f6; }

    .online-dot {
      width: 9px;
      height: 9px;
      background: #22c55e;
      border-radius: 50%;
      position: absolute;
      bottom: 0;
      right: 0;
      border: 2px solid #161616;
    }

    #lista-online {
      flex: 1;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      padding: 4px 0 20px;
    }

    .secao-titulo {
      padding: 14px 16px 8px;
      font-size: 0.75rem;
      color: #666;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .usuario-item {
      padding: 12px 16px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 12px;
      transition: background 0.15s;
      min-height: 52px;
    }

    .usuario-item:hover, .usuario-item:active { background: #222; }
    .usuario-item.eu { opacity: 0.55; cursor: default; }
    .usuario-item.eu:hover, .usuario-item.eu:active { background: transparent; }

    .usuario-item .avatar {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: #333;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.9rem;
      font-weight: 600;
      position: relative;
      flex-shrink: 0;
    }

    /* ===== MAIN ===== */
    #main {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-width: 0;
      height: 100%;
    }

    header {
      background: #1a1a1a;
      padding: 12px 16px;
      border-bottom: 1px solid #2a2a2a;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      min-height: 56px;
      flex-shrink: 0;
    }

    header h1 {
      font-size: 1.05rem;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    #status {
      font-size: 0.78rem;
      color: #888;
      white-space: nowrap;
    }
    #status.online { color: #22c55e; }

    #mensagens {
      flex: 1;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .msg {
      max-width: 85%;
      padding: 10px 14px;
      border-radius: 14px;
      line-height: 1.4;
      word-break: break-word;
      animation: aparecer 0.2s ease;
      font-size: 0.95rem;
    }

    @keyframes aparecer {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .msg.eu {
      align-self: flex-end;
      background: #3b82f6;
      border-bottom-right-radius: 4px;
    }

    .msg.outro {
      align-self: flex-start;
      background: #2a2a2a;
      border-bottom-left-radius: 4px;
    }

    .msg .nome {
      font-size: 0.72rem;
      font-weight: 600;
      margin-bottom: 3px;
      opacity: 0.85;
    }

    .msg .hora {
      font-size: 0.68rem;
      opacity: 0.55;
      margin-top: 4px;
      text-align: right;
    }

    .barra {
      background: #1a1a1a;
      border-top: 1px solid #2a2a2a;
      padding: 12px 12px;
      padding-bottom: max(12px, env(safe-area-inset-bottom));
      display: flex;
      gap: 8px;
      flex-shrink: 0;
    }

    #input {
      flex: 1;
      background: #2d2d2d;
      border: 1px solid #3a3a3a;
      border-radius: 22px;
      padding: 12px 16px;
      font-size: 16px; /* evita zoom no iOS */
      color: white;
      outline: none;
      min-width: 0;
    }
    #input:focus { border-color: #3b82f6; }
    #input::placeholder { color: #777; }

    #btn-enviar {
      background: #3b82f6;
      color: white;
      border: none;
      border-radius: 50%;
      width: 44px;
      height: 44px;
      font-size: 1.1rem;
      font-weight: 600;
      cursor: pointer;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0;
    }
    #btn-enviar:disabled { background: #374151; }

    #btn-menu-mobile {
      display: none;
      background: none;
      border: none;
      color: #fff;
      font-size: 1.4rem;
      cursor: pointer;
      padding: 6px;
      line-height: 1;
    }

    #btn-trocar-nome {
      background: transparent;
      border: none;
      color: #888;
      font-size: 0.78rem;
      cursor: pointer;
      padding: 6px 8px;
    }

    /* Tela de nome */
    #tela-nome {
      position: fixed;
      inset: 0;
      background: #0f0f0f;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 300;
      padding: 20px;
    }

    .caixa-nome {
      background: #1e1e1e;
      padding: 28px 24px;
      border-radius: 18px;
      width: 100%;
      max-width: 360px;
      text-align: center;
      border: 1px solid #333;
    }

    .caixa-nome h2 { margin-bottom: 8px; font-size: 1.25rem; }
    .caixa-nome p { color: #888; font-size: 0.9rem; margin-bottom: 20px; }

    #nome-input {
      width: 100%;
      background: #2d2d2d;
      border: 1px solid #3a3a3a;
      border-radius: 12px;
      padding: 14px 16px;
      font-size: 16px;
      color: white;
      outline: none;
      margin-bottom: 14px;
    }
    #nome-input:focus { border-color: #3b82f6; }

    #btn-entrar {
      width: 100%;
      background: #3b82f6;
      color: white;
      border: none;
      border-radius: 12px;
      padding: 14px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
    }

    .overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.55);
      z-index: 140;
    }
    .overlay.ativo { display: block; }

    /* ========== MOBILE ========== */
    @media (max-width: 768px) {
      #sidebar {
        position: fixed;
        left: -300px;
        top: 0;
        bottom: 0;
        z-index: 150;
        width: 85%;
        max-width: 300px;
        transition: left 0.25s ease;
        box-shadow: 4px 0 20px rgba(0,0,0,0.4);
      }
      #sidebar.aberta { left: 0; }

      #btn-menu-mobile { display: block; }

      .msg { max-width: 90%; }

      header { padding: 10px 12px; }
    }

    /* Telas bem pequenas */
    @media (max-width: 380px) {
      .msg { max-width: 92%; font-size: 0.9rem; }
      #btn-enviar { width: 42px; height: 42px; }
    }
  </style>
</head>
<body>

  <div id="tela-nome">
    <div class="caixa-nome">
      <h2>Entrar no Chat</h2>
      <p>Digite um nome para começar</p>
      <input type="text" id="nome-input" placeholder="Seu nome..." maxlength="20" autofocus autocomplete="off" />
      <button id="btn-entrar">Entrar</button>
    </div>
  </div>

  <div class="overlay" id="overlay"></div>

  <!-- SIDEBAR -->
  <aside id="sidebar">
    <div class="sidebar-header">
      <h2>Chat</h2>
    </div>

    <div class="sala-item geral ativa" id="btn-geral" data-sala="geral">
      <div class="icone">🌐</div>
      <div>
        <div style="font-weight:600; font-size:0.95rem">Geral</div>
        <div style="font-size:0.75rem; color:#888">Todos</div>
      </div>
    </div>

    <div class="secao-titulo">Online</div>
    <div id="lista-online"></div>
  </aside>

  <!-- MAIN -->
  <div id="main">
    <header>
      <div style="display:flex; align-items:center; gap:10px; min-width:0; flex:1;">
        <button id="btn-menu-mobile" aria-label="Menu">☰</button>
        <h1 id="titulo-sala">Geral</h1>
      </div>
      <div style="display:flex; align-items:center; gap:6px; flex-shrink:0;">
        <button id="btn-trocar-nome">Trocar nome</button>
        <div id="status">...</div>
      </div>
    </header>

    <div id="mensagens"></div>

    <div class="barra">
      <input type="text" id="input" placeholder="Mensagem..." disabled autocomplete="off" />
      <button id="btn-enviar" disabled aria-label="Enviar">➤</button>
    </div>
  </div>

  <script>
    const socket = io();
    let meuNome = "";
    let meuId = "";
    let salaAtual = "geral";
    let usuariosOnline = [];

    const telaNome = document.getElementById("tela-nome");
    const nomeInput = document.getElementById("nome-input");
    const btnEntrar = document.getElementById("btn-entrar");
    const mensagensEl = document.getElementById("mensagens");
    const inputEl = document.getElementById("input");
    const btnEnviar = document.getElementById("btn-enviar");
    const statusEl = document.getElementById("status");
    const listaOnline = document.getElementById("lista-online");
    const tituloSala = document.getElementById("titulo-sala");
    const btnGeral = document.getElementById("btn-geral");
    const btnTrocarNome = document.getElementById("btn-trocar-nome");
    const btnMenuMobile = document.getElementById("btn-menu-mobile");
    const sidebar = document.getElementById("sidebar");
    const overlay = document.getElementById("overlay");

    function pedirPermissaoNotificacao() {
      if (!("Notification" in window)) return;
      if (Notification.permission === "default") Notification.requestPermission();
    }

    function mostrarNotificacao(nome, texto) {
      if (!("Notification" in window) || Notification.permission !== "granted") return;
      if (document.hidden) {
        const n = new Notification(nome + " disse:", {
          body: texto,
          icon: "https://cdn-icons-png.flaticon.com/512/134/134914.png",
          tag: "chat-mensagem",
          renotify: true
        });
        n.onclick = () => { window.focus(); n.close(); };
      }
    }

    function criarIdSalaPrivada(id1, id2) {
      return "dm_" + [id1, id2].sort().join("_");
    }

    function entrarSala(sala, titulo) {
      salaAtual = sala;
      socket.emit("entrar-sala", sala);
      mensagensEl.innerHTML = "";
      tituloSala.textContent = titulo;

      document.querySelectorAll(".sala-item").forEach(el => el.classList.remove("ativa"));
      if (sala === "geral") btnGeral.classList.add("ativa");

      sidebar.classList.remove("aberta");
      overlay.classList.remove("ativo");
      inputEl.focus();
    }

    btnGeral.addEventListener("click", () => entrarSala("geral", "Geral"));

    function renderOnline() {
      listaOnline.innerHTML = "";
      usuariosOnline.forEach(u => {
        const isEu = u.id === meuId;
        const div = document.createElement("div");
        div.className = "usuario-item" + (isEu ? " eu" : "");
        div.innerHTML = `
          <div class="avatar">
            ${u.nome.charAt(0).toUpperCase()}
            <div class="online-dot"></div>
          </div>
          <div style="font-size:0.9rem;">${isEu ? u.nome + " (você)" : u.nome}</div>
        `;
        if (!isEu) {
          div.addEventListener("click", () => {
            const sala = criarIdSalaPrivada(meuId, u.id);
            entrarSala(sala, u.nome);
          });
        }
        listaOnline.appendChild(div);
      });
    }

    socket.on("usuarios-online", (lista) => {
      usuariosOnline = lista;
      const eu = lista.find(u => u.nome === meuNome);
      if (eu) meuId = eu.id;
      renderOnline();
    });

    function entrar(nomeSalvo = null) {
      const nome = nomeSalvo || nomeInput.value.trim();
      if (!nome) return;

      meuNome = nome;
      localStorage.setItem("chat_nome", meuNome);
      socket.emit("entrar", meuNome);

      telaNome.style.display = "none";
      inputEl.disabled = false;
      btnEnviar.disabled = false;
      inputEl.focus();
      pedirPermissaoNotificacao();
    }

    const nomeSalvo = localStorage.getItem("chat_nome");
    if (nomeSalvo) entrar(nomeSalvo);

    btnEntrar.addEventListener("click", () => entrar());
    nomeInput.addEventListener("keydown", (e) => { if (e.key === "Enter") entrar(); });

    btnTrocarNome.addEventListener("click", () => {
      localStorage.removeItem("chat_nome");
      location.reload();
    });

    function enviar() {
      const texto = inputEl.value.trim();
      if (!texto || !meuNome) return;

      const hora = new Date().toLocaleTimeString("pt-BR", { hour: "2-digit", minute: "2-digit" });
      socket.emit("mensagem", { sala: salaAtual, nome: meuNome, texto, hora });
      inputEl.value = "";
      inputEl.focus();
    }

    btnEnviar.addEventListener("click", enviar);
    inputEl.addEventListener("keydown", (e) => { if (e.key === "Enter") enviar(); });

    socket.on("mensagem", (data) => {
      if (data.sala !== salaAtual) return;

      const div = document.createElement("div");
      div.className = "msg " + (data.nome === meuNome ? "eu" : "outro");
      div.innerHTML = `
        <div class="nome">${data.nome === meuNome ? "Você" : data.nome}</div>
        <div>${escapeHtml(data.texto)}</div>
        <div class="hora">${data.hora}</div>
      `;
      mensagensEl.appendChild(div);
      mensagensEl.scrollTop = mensagensEl.scrollHeight;

      if (data.nome !== meuNome) mostrarNotificacao(data.nome, data.texto);
    });

    socket.on("connect", () => {
      statusEl.textContent = "Online";
      statusEl.classList.add("online");
      if (meuNome) socket.emit("entrar", meuNome);
    });

    socket.on("disconnect", () => {
      statusEl.textContent = "Off";
      statusEl.classList.remove("online");
    });

    function escapeHtml(t) {
      const d = document.createElement("div");
      d.textContent = t;
      return d.innerHTML;
    }

    // Menu mobile
    btnMenuMobile.addEventListener("click", () => {
      sidebar.classList.toggle("aberta");
      overlay.classList.toggle("ativo");
    });
    overlay.addEventListener("click", () => {
      sidebar.classList.remove("aberta");
      overlay.classList.remove("ativo");
    });
  </script>
</body>
</html>

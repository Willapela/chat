<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Chat</title>
  <script src="/socket.io/socket.io.js"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
      background: #0f0f0f;
      color: #fff;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      background: #1a1a1a;
      padding: 14px 20px;
      border-bottom: 1px solid #2a2a2a;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    header h1 {
      font-size: 1.15rem;
      font-weight: 600;
    }

    #status {
      font-size: 0.85rem;
      color: #888;
    }

    #status.online {
      color: #22c55e;
    }

    #mensagens {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .msg {
      max-width: 75%;
      padding: 10px 14px;
      border-radius: 12px;
      line-height: 1.4;
      word-break: break-word;
      animation: aparecer 0.2s ease;
    }

    @keyframes aparecer {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .msg.eu {
      align-self: flex-end;
      background: #3b82f6;
      border-bottom-right-radius: 4px;
    }

    .msg.outro {
      align-self: flex-start;
      background: #2a2a2a;
      border-bottom-left-radius: 4px;
    }

    .msg .nome {
      font-size: 0.75rem;
      font-weight: 600;
      margin-bottom: 3px;
      opacity: 0.8;
    }

    .msg .hora {
      font-size: 0.7rem;
      opacity: 0.6;
      margin-top: 4px;
      text-align: right;
    }

    .barra {
      background: #1a1a1a;
      border-top: 1px solid #2a2a2a;
      padding: 14px 16px;
      display: flex;
      gap: 10px;
    }

    #input {
      flex: 1;
      background: #2d2d2d;
      border: 1px solid #3a3a3a;
      border-radius: 10px;
      padding: 12px 16px;
      font-size: 1rem;
      color: white;
      outline: none;
    }

    #input:focus {
      border-color: #3b82f6;
    }

    #input::placeholder {
      color: #777;
    }

    button {
      background: #3b82f6;
      color: white;
      border: none;
      border-radius: 10px;
      padding: 12px 20px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }

    button:hover {
      background: #2563eb;
    }

    button:disabled {
      background: #374151;
      cursor: not-allowed;
    }

    #tela-nome {
      position: fixed;
      inset: 0;
      background: #0f0f0f;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 100;
    }

    .caixa-nome {
      background: #1e1e1e;
      padding: 30px;
      border-radius: 16px;
      width: 90%;
      max-width: 360px;
      text-align: center;
      border: 1px solid #333;
    }

    .caixa-nome h2 {
      margin-bottom: 8px;
      font-size: 1.3rem;
    }

    .caixa-nome p {
      color: #888;
      font-size: 0.9rem;
      margin-bottom: 20px;
    }

    #nome-input {
      width: 100%;
      background: #2d2d2d;
      border: 1px solid #3a3a3a;
      border-radius: 10px;
      padding: 12px 16px;
      font-size: 1rem;
      color: white;
      outline: none;
      margin-bottom: 14px;
    }

    #nome-input:focus {
      border-color: #3b82f6;
    }

    #btn-trocar-nome {
      background: transparent;
      border: none;
      color: #888;
      font-size: 0.8rem;
      cursor: pointer;
      padding: 4px 8px;
    }

    #btn-trocar-nome:hover {
      color: #fff;
    }
  </style>
</head>
<body>

  <div id="tela-nome">
    <div class="caixa-nome">
      <h2>Entrar no Chat</h2>
      <p>Digite um nome para começar</p>
      <input type="text" id="nome-input" placeholder="Seu nome..." maxlength="20" autofocus />
      <button id="btn-entrar" style="width:100%">Entrar</button>
    </div>
  </div>

  <header>
    <h1>Chat</h1>
    <div style="display:flex; align-items:center; gap:12px;">
      <button id="btn-trocar-nome" title="Trocar de nome">Trocar nome</button>
      <div id="status">Conectando...</div>
    </div>
  </header>

  <div id="mensagens"></div>

  <div class="barra">
    <input type="text" id="input" placeholder="Digite sua mensagem..." disabled />
    <button id="btn-enviar" disabled>Enviar</button>
  </div>

  <script>
    const socket = io();
    let meuNome = "";

    const telaNome = document.getElementById("tela-nome");
    const nomeInput = document.getElementById("nome-input");
    const btnEntrar = document.getElementById("btn-entrar");
    const mensagensEl = document.getElementById("mensagens");
    const inputEl = document.getElementById("input");
    const btnEnviar = document.getElementById("btn-enviar");
    const statusEl = document.getElementById("status");
    const btnTrocarNome = document.getElementById("btn-trocar-nome");

    // ===== NOTIFICAÇÕES =====
    function pedirPermissaoNotificacao() {
      if (!("Notification" in window)) return;
      if (Notification.permission === "default") {
        Notification.requestPermission();
      }
    }

    function mostrarNotificacao(nome, texto) {
      if (!("Notification" in window)) return;
      if (Notification.permission !== "granted") return;

      if (document.hidden) {
        const notificacao = new Notification(nome + " disse:", {
          body: texto,
          icon: "https://cdn-icons-png.flaticon.com/512/134/134914.png",
          tag: "chat-mensagem",
          renotify: true
        });

        notificacao.onclick = () => {
          window.focus();
          notificacao.close();
        };
      }
    }

    // ===== ENTRAR / LOCALSTORAGE =====
    function entrar(nomeSalvo = null) {
      const nome = nomeSalvo || nomeInput.value.trim();
      if (!nome) return;

      meuNome = nome;
      localStorage.setItem("chat_nome", meuNome); // salva o nome

      telaNome.style.display = "none";
      inputEl.disabled = false;
      btnEnviar.disabled = false;
      inputEl.focus();

      pedirPermissaoNotificacao();
    }

    // Verifica se já tem nome salvo
    const nomeSalvo = localStorage.getItem("chat_nome");
    if (nomeSalvo) {
      // Já tem nome → entra direto
      entrar(nomeSalvo);
    }

    btnEntrar.addEventListener("click", () => entrar());
    nomeInput.addEventListener("keydown", (e) => {
      if (e.key === "Enter") entrar();
    });

    // Botão para trocar de nome
    btnTrocarNome.addEventListener("click", () => {
      localStorage.removeItem("chat_nome");
      meuNome = "";
      telaNome.style.display = "flex";
      inputEl.disabled = true;
      btnEnviar.disabled = true;
      nomeInput.value = "";
      nomeInput.focus();
    });

    // Enviar mensagem
    function enviar() {
      const texto = inputEl.value.trim();
      if (!texto || !meuNome) return;

      const agora = new Date();
      const hora = agora.toLocaleTimeString("pt-BR", { hour: "2-digit", minute: "2-digit" });

      socket.emit("mensagem", {
        nome: meuNome,
        texto: texto,
        hora: hora
      });

      inputEl.value = "";
      inputEl.focus();
    }

    btnEnviar.addEventListener("click", enviar);
    inputEl.addEventListener("keydown", (e) => {
      if (e.key === "Enter") enviar();
    });

    // Receber mensagem
    socket.on("mensagem", (data) => {
      const div = document.createElement("div");
      div.className = "msg " + (data.nome === meuNome ? "eu" : "outro");

      div.innerHTML = `
        <div class="nome">${data.nome === meuNome ? "Você" : data.nome}</div>
        <div>${escapeHtml(data.texto)}</div>
        <div class="hora">${data.hora}</div>
      `;

      mensagensEl.appendChild(div);
      mensagensEl.scrollTop = mensagensEl.scrollHeight;

      if (data.nome !== meuNome) {
        mostrarNotificacao(data.nome, data.texto);
      }
    });

    // Status de conexão
    socket.on("connect", () => {
      statusEl.textContent = "Online";
      statusEl.classList.add("online");
    });

    socket.on("disconnect", () => {
      statusEl.textContent = "Desconectado";
      statusEl.classList.remove("online");
    });

    function escapeHtml(texto) {
      const div = document.createElement("div");
      div.textContent = texto;
      return div.innerHTML;
    }
  </script>
</body>
</html>
